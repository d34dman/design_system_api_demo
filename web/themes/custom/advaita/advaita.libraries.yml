global:
  css:
    base:
      css/base/elements.css: {}
    layout:
      css/layout/site.css: {}
      css/layout/admin.css: {}
    component:
      css/components/button.css: {}
      css/components/form.css: {}
      css/components/details.css: {}
      css/components/messages.css: {}
      css/components/table.css: {}
      css/components/tabs.css: {}
      css/components/breadcrumb.css: {}
      css/components/pager.css: {}
      css/components/action-links.css: {}
      css/components/node.css: {}
      css/components/admin-list.css: {}
      css/components/node-form.css: {}
      css/components/ckeditor.css: {}
  js:
    js/mode.js: {}
  dependencies:
    - core/drupal
    - core/once

# Contract icons for markup core builds in JavaScript (js/icons.js). The libraries
# below extend core's (advaita.info.yml), so their scripts run right after core's
# and replace its Drupal.theme functions.
icons:
  js:
    js/icons.js: {}
  dependencies:
    - core/drupal

dialog:
  css:
    component:
      css/components/dialog.css: {}
  js:
    js/dialog.js: {}
  dependencies:
    - advaita/icons

tabledrag:
  css:
    component:
      css/components/tabledrag.css: {}
  js:
    js/tabledrag.js: {}
  dependencies:
    - advaita/icons

dropbutton:
  css:
    component:
      css/components/dropbutton.css: {}
  js:
    js/dropbutton.js: {}
  dependencies:
    - advaita/icons
    - core/once

vertical-tabs:
  css:
    component:
      css/components/vertical-tabs.css: {}

autocomplete:
  css:
    component:
      css/components/autocomplete.css: {}
