$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Badge
status: experimental
description: 'A short status label. Its tone is a status token, never a hue.'
props:
  type: object
  required: [label]
  properties:
    label: { type: string, title: Label }
    tone:
      type: string
      enum: [neutral, info, success, warning, danger]
      default: neutral
