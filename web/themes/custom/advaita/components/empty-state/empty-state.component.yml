$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Empty state
status: experimental
description: 'What a list shows when it has nothing to show: what that means, and what to do next.'
props:
  type: object
  required: [heading]
  properties:
    heading: { type: string, title: Heading }
    text: { type: [string, 'null'], title: Text }
    tone:
      type: string
      enum: [neutral, success]
      default: neutral
slots:
  action: { title: Action }
