      font.size.2xl: '1.5rem'
      font.line-height.tight: 1.33
      font.line-height.base: 1.43
      # The steps Canvas uses from Radix's 4px scale: 8px around the top bar,
      # 12-16px in panels.
      space.2xs: '0.25rem'
      space.xs: '0.375rem'
      space.s: '0.5rem'
      space.m: '0.75rem'
      space.l: '1rem'
