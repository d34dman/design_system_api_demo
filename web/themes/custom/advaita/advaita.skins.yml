      shadow.overlay: '0 0 0 1px #393d40, 0 12px 60px rgb(0 0 0 / 0.3), 0 12px 32px -16px rgb(0 0 0 / 0.5)'
      color.fg.loud: '{palette.neutral-12}'
    # More contrast, the accessible option: the solid steps are the darker
    # blue that takes white at 4.5:1, and the fills the contract's further
    # steps (accent-11 light, accent-10 dark), with text that holds.
    contrast=more:
      palette.accent-1: '#fbfdff'
