      shadow.raised: '0 0 0 1px rgb(0 0 0 / 0.05), 0 1px 3px rgb(0 0 0 / 0.07)'
      shadow.overlay: '0 0 0 1px rgb(0 0 0 / 0.05), 0 12px 60px rgb(0 0 0 / 0.15), 0 12px 32px -16px rgb(0 0 0 / 0.12)'
    mode=dark:
      # Canvas ships light only; dark is Radix's dark blue and slate as Radix
      # renders them: on its panels (gray-2), Radix paints component steps
      # with its alpha scale, so steps 3-10 are those alpha steps composited
      # over the panel (light needs no such step: there they equal the solid
      # steps). Fields sit on Radix's surface (darker than the panel), menus
      # and dialogs on the panel, with Radix's light 1px ring. Blue-8 holds
      # 3:1 as the focus ring; accent text is blue-11, the fill blue-9.
      palette.accent-1: '#0d1520'
      palette.accent-2: '#172030'
      palette.accent-3: '#122e4e'
      palette.accent-4: '#0f3868'
