advaita_canvas_ui:
  label: 'Canvas UI'
  description: 'A chrome that matches the Drupal Canvas editor: Radix slate and blue, white panels, the system font, 14px text and 12px small text, 24 and 32px controls, 3-6px corners. Canvas itself is untouched.'
  color_schemes: [light, dark]
  # Solid buttons are Canvas's: white on Radix blue-9 (Shibin, 2026-10-17).
  # That misses 4.5:1, so the skin declares it (D28); with more contrast the
  # fill is the contract's further step and every pair holds.
  departures:
    - rule: color/text-contrast
      pairs: [[color.fg.on-action, color.action.primary]]
      modes: [base, dark]
      reason: 'Canvas draws its solid buttons white on Radix blue-9 (3.3:1). More contrast darkens the fill (5.2:1).'
    - rule: color/palette-pairs
      pairs: [[palette.accent-1, palette.accent-9], [palette.accent-1, palette.accent-10]]
      modes: [base]
      reason: 'Radix blue-9 and blue-10 are the solid fills, as in Canvas (3.2 and 3.5:1 against step 1).'
  values:
    base:
      # Radix Themes as Canvas configures it: accentColor blue, gray "auto" (which
      # Radix pairs with blue as slate), panelBackground solid (white panels),
      # radius medium, scaling 100%. The ramps are Radix blue and slate, with
      # these departures for the contract's pairs (D26, D27, D28):
      # - accent 9 and 10 are Radix's solid fills; white on them misses 4.5:1
      #   (the departures above);
      # - accent 11 (link and selected text, color.fg.primary) is Radix blue-11
      #   #0d74ce made 3% darker, #0c6fc8: blue-11 is 4.25:1 on blue-3, the
      #   selected background (4.54 now);
      # - the focus colour is blue-9: Radix's focus-8 (blue-8) is 2.3:1 on the
      #   page;
      # - green and amber text are a shade darker than Radix's step 11, which
      #   is 4.2:1 on its own tint.
      palette.accent-1: '#fbfdff'
      palette.accent-2: '#f4faff'
      palette.accent-3: '#e6f4fe'
      palette.accent-4: '#d5efff'
      palette.accent-5: '#c2e5ff'
      palette.accent-6: '#acd8fc'
      palette.accent-7: '#8ec8f6'
      palette.accent-8: '#5eb1ef'
      palette.accent-9: '#0090ff'
      palette.accent-10: '#0588f0'
      palette.accent-11: '#0c6fc8'
      palette.accent-12: '#113264'
