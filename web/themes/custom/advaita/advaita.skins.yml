# Advaita's two design systems as skins (skins-and-modes plan, M2): values only,
# usable whatever the active theme. Each palette is hand-tuned per mode; the contract
# maps the semantic tokens to its steps. Semantic values below the steps are what a
# step can't express without a visible change from the theme's values file:
# - color.fg.loud is beyond the darkest text step (a fixed contract value);
# - color.fg.disabled and color.border.input differ but share step 8 (light; dark
#   too for indigo), and color.bg.input differs from step 3 in dark mode;
# - status colors stay semantic in v0;
# - contrast=more: the theme had no more-contrast values, and these keep it so
#   until the skins tune a contrast=more set.
# The theme carries no values: the site binds them (skins-and-modes plan, M3), e.g.
#   drush ds:bind site advaita_paper && drush ds:bind chrome advaita_indigo
# advaita_ember is a third, warm chrome to swap in without touching the theme.
# Typefaces are fonts declared in advaita.fonts.yml ({font: <id>}, plan M4): the module
# writes the family stack and the @font-face rules of every bound skin's fonts.
# Icons (plan M5): the chrome skins name an icon pack from advaita.icons.yml and map
# the contract's icon names to it; advaita_paper names none, so the site draws the
# contract's default icons.

advaita_paper:
  label: 'Advaita paper'
  description: 'The site: warm paper, a serif for headings, deep green actions.'
