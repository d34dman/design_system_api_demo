# Advaita implements the contract itself: these are its values, not a mapping
# to variables of its own. Base values are the site's design system; role=admin
# values are the admin's. The same components render in both (D-prototype).
theme: advaita
color_schemes: [light, dark]
values:
  # The site: warm paper, a serif for headings, deep green actions.
  base:
    color.bg.canvas: '#faf8f4'
    color.bg.surface: '#ffffff'
    color.bg.surface-nested: '#f3f0e9'
    color.bg.raised: '#ffffff'
    color.bg.input: '#ffffff'
    color.fg.default: '#25221d'
    color.fg.soft: '#5b5549'
    color.fg.loud: '#13110d'
    color.fg.on-action: '#ffffff'
    color.fg.disabled: '#7c7568'
    color.border.default: '#ddd6c9'
    color.border.soft: '#ebe6dc'
    color.border.loud: '#766f62'
    color.border.input: '#857e70'
    color.action.primary: '#0d6b5b'
    color.action.primary-hover: '#09564a'
    color.action.primary-soft: '#dcefe9'
    color.status.error: '#b42318'
    color.status.warning: '#8a5300'
    color.status.success: '#146c2e'
    color.focus: '#0d6b5b'
    font.family.base: 'Public Sans, system-ui, sans-serif'
    font.family.heading: 'Fraunces, Georgia, serif'
    radius.s: '0.25rem'
    radius.m: '0.5rem'
    radius.l: '0.875rem'
    font.size.xl: '2rem'
    font.size.2xl: '2.75rem'
  mode=dark:
    color.bg.canvas: '#16140f'
    color.bg.surface: '#1f1c16'
    color.bg.surface-nested: '#2a261e'
    color.bg.raised: '#2f2b22'
    color.bg.input: '#24211a'
    color.fg.default: '#ece6da'
    color.fg.soft: '#b8af9f'
    color.fg.loud: '#fffaf0'
    color.fg.on-action: '#0b1f1b'
    color.fg.disabled: '#8f8778'
    color.border.default: '#3d382e'
    color.border.soft: '#2e2a22'
    color.border.loud: '#a39a8a'
    color.border.input: '#8f8778'
    color.action.primary: '#62c7b1'
    color.action.primary-hover: '#85d8c6'
    color.action.primary-soft: '#173b34'
    color.status.error: '#ff8f80'
    color.status.warning: '#f1b552'
    color.status.success: '#72d18f'
    color.focus: '#62c7b1'
  # The admin: cool neutrals, Inter, indigo actions, tighter type.
  role=admin:
    color.bg.canvas: '#f4f5f8'
    color.bg.surface: '#ffffff'
    color.bg.surface-nested: '#eef0f4'
    color.bg.raised: '#ffffff'
    color.bg.input: '#ffffff'
    color.fg.default: '#171a21'
    color.fg.soft: '#4a5061'
    color.fg.loud: '#0b0c10'
    color.fg.on-action: '#ffffff'
    color.fg.disabled: '#727888'
    color.border.default: '#d8dbe3'
    color.border.soft: '#e7e9ef'
    color.border.loud: '#6a7083'
    color.border.input: '#80869a'
    color.action.primary: '#3a4fd6'
    color.action.primary-hover: '#2d3fb4'
    color.action.primary-soft: '#e4e8fc'
    color.status.error: '#c0262d'
    color.status.warning: '#8c5600'
    color.status.success: '#177245'
    color.focus: '#3a4fd6'
    font.family.base: 'Inter, system-ui, sans-serif'
    font.family.heading: '{font.family.base}'
    radius.s: '0.25rem'
    radius.m: '0.375rem'
    radius.l: '0.625rem'
    font.size.xl: '1.5rem'
    font.size.2xl: '1.875rem'
  role=admin mode=dark:
    color.bg.canvas: '#111318'
    color.bg.surface: '#1a1d24'
    color.bg.surface-nested: '#232731'
    color.bg.raised: '#2a2f3a'
    color.bg.input: '#1f232b'
    color.fg.default: '#e3e6ec'
    color.fg.soft: '#a5abb9'
    color.fg.loud: '#ffffff'
    color.fg.on-action: '#0d1030'
    color.fg.disabled: '#7d8394'
    color.border.default: '#30353f'
    color.border.soft: '#262a33'
    color.border.loud: '#8e94a4'
    color.border.input: '#6e7486'
    color.action.primary: '#8d9cff'
    color.action.primary-hover: '#aab5ff'
    color.action.primary-soft: '#272d55'
    color.status.error: '#ff9090'
    color.status.warning: '#f4b84f'
    color.status.success: '#70d39b'
    color.focus: '#8d9cff'
