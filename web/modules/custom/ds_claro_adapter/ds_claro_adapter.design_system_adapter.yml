# Maps the contract to Claro's custom properties (core Claro on Drupal 11, contrib Claro 3 on Drupal 12).
# Claro has no dark mode; the tokens it doesn't name (surface tints, radii)
# point at its own palette, so the Media Library stays in Claro's colors.
theme: claro
values:
  base:
    color.bg.canvas: 'var(--color-gray-050)'
    color.bg.surface: 'var(--color-white)'
    color.bg.surface-nested: 'var(--color-gray-050)'
    color.bg.raised: 'var(--color-white)'
    color.bg.input: 'var(--input-bg-color)'
    color.bg.input-disabled: 'var(--input--disabled-bg-color)'
    color.bg.selected: 'var(--color-bgblue-active)'
    color.fg.default: 'var(--color-text)'
    color.fg.soft: 'var(--color-gray-800)'
    color.fg.loud: 'var(--color-gray)'
    color.fg.on-action: 'var(--color-white)'
    color.fg.disabled: 'var(--input--disabled-fg-color)'
    color.fg.link: 'var(--color-link)'
    color.fg.primary: 'var(--color-link)'
    color.border.default: 'var(--color-gray-200)'
    color.border.soft: 'var(--color-gray-100)'
    color.border.loud: 'var(--color-gray-500)'
    color.border.input: 'var(--input-border-color)'
    color.border.hover: 'var(--color-gray-400)'
    color.border.primary: 'var(--color-absolutezero)'
    color.border.primary-soft: 'var(--color-blue-200)'
    color.border.primary-hover: 'var(--color-blue-400)'
    color.action.primary: 'var(--color-absolutezero)'
    color.action.primary-hover: 'var(--color-absolutezero-hover)'
    color.action.primary-soft: 'var(--color-bgblue-hover)'
    color.action.primary-soft-hover: 'var(--color-bgblue-active)'
    color.action.primary-soft-hover-text: 'var(--color-blue-800)'
    color.action.primary-faint: 'var(--color-blue-020)'
    color.action.danger: 'var(--color-maximumred)'
    color.action.danger-hover: 'var(--color-maximumred-hover)'
    color.status.error: 'var(--color-maximumred)'
    color.status.warning: 'var(--color-sunglow-shaded)'
    color.status.success: 'var(--color-lightninggreen)'
    color.status.error-soft: 'var(--color-red-050)'
    color.status.error-soft-hover: 'var(--color-red-070)'
    color.status.error-soft-hover-text: 'var(--color-red-700)'
    # Claro has red tints only; the others are its status colors on white.
    color.status.warning-soft: 'color-mix(in srgb, var(--color-sunglow) 15%, var(--color-white))'
    color.status.success-soft: 'color-mix(in srgb, var(--color-lightninggreen) 12%, var(--color-white))'
    color.focus: 'var(--color-focus)'
    space.2xs: '0.25rem'
    space.xs: 'var(--space-xs)'
    space.s: 'var(--space-s)'
    space.m: 'var(--space-m)'
    space.l: 'var(--space-l)'
    space.xl: 'var(--space-xl)'
    radius.s: 'var(--base-border-radius)'
    radius.m: 'var(--base-border-radius)'
    radius.l: '0.25rem'
    font.size.xs: 'var(--font-size-xs)'
    font.size.s: 'var(--font-size-s)'
    font.size.m: 'var(--font-size-base)'
    font.size.l: 'var(--font-size-h5, 1.125rem)'
    font.weight.normal: 'normal'
    font.weight.strong: 'bold'
    shadow.raised: '0 1px 2px rgb(0 0 0 / 0.1)'
    shadow.overlay: 'var(--shadow-z3)'
    focus.ring.width: 'var(--focus-border-size)'
    focus.ring.offset: 'var(--focus-border-offset-size)'
    motion.duration.s: 'var(--speed-transition)'
