advaita_showcase.dashboard:
  path: '/admin/dashboard'
  defaults:
    _controller: '\Drupal\advaita_showcase\Controller\DashboardController::build'
    _title: 'Dashboard'
  requirements:
    _permission: 'access content overview'
  options:
    _admin_route: TRUE
advaita_showcase.spec_sheet:
  path: '/admin/advaita/spec'
  defaults:
    _form: '\Drupal\advaita_showcase\Form\SpecSheetForm'
    _title: 'Spec sheet'
  requirements:
    _permission: 'administer site configuration'
  options:
    _admin_route: TRUE
